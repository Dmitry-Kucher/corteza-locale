          private: Содержимое будет минимизировано
        requests:
          sign-requests: Подписать AuthNRequest и утверждение
          sign-method: Метод, используемый для подписи запросов
          binding: Тип HTTP-привязки, используемой для AuthNRequest, по умолчанию HTTP Redirect (GET)
