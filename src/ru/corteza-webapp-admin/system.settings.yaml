        binding-post: HTTP POST
      cert:
        public: Публичный ключ
        private: Приватный ключ
      name: Имя
      certificate: Сертификат
      idp:
        title: Провайдер удостоверений
        ident-handle: Поле обработчика
        ident-identifier: Поле идентификатора
        ident-name: Поле имени
        url: URL
      desc:
        name: Имя IdP, используемое на экране входа (Войти с помощью <имя>)
