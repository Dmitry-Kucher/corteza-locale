          url: Расположение метаданных IdP
          ident-handle: Имя поля IdP, используемого для заполнения имени пользователя Corteza или nickname
          ident-identifier: Имя поля IdP, используемого для заполнения и сопоставления email пользователя Corteza
          ident-name: Имя поля IdP, используемого для заполнения полного имени пользователя Corteza

    security:
      title: Безопасность
      prohibited-roles:
        description: Роли из этого списка будут удалены из контекста безопасности при аутентификации с помощью этого провайдера
        label: Запрещенные роли
      forced-roles:
        description: Роли из этого списка всегда будут добавлены в контекст безопасности при аутентификации с помощью этого провайдера
        label: Вынужденные роли
      permitted-roles:
        description: Только роли из этого списка будут добавлены в контекст безопасности при аутентификации с помощью этого провайдера
        label: Разрешенные роли

