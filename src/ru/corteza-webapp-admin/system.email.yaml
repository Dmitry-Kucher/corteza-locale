editor:
  title: Настройки электронной почты

  server:
    title: SMTP сервер

    host:
      label: Сервер
      description: Имя сервера и порт. Обычно порт 25 (без защиты), 465 или 587 (с защитой).

    user:
      label: Пользователь
      description: Необязательно, учетные данные для авторизации на почтовом сервере.

    password:
      label: Пароль
      description: Необязательно, учетные данные для авторизации на почтовом сервере.

    from:
      label: Адрес отправителя
      description: Адрес отправителя по умолчанию (заголовок FROM) для отправки писем.

    tlsInsecure:
      label: Разрешить использование недействительных сертификатов
      description: Подавлять ошибку, если Corteza не может проверить TLS-сертификат SMTP сервера.

    tlsServerName:
      label: Имя TLS сервера
      description: Необязательно. Если SMTP сервер использует другое имя, чем указано для сервера.
    
    testSmtpConfigs:
      button: Проверить SMTP сервер
