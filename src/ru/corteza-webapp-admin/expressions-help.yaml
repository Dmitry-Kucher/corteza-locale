calculate: Поля-выражения позволяют вычислять значения на основе заданного выражения
categories:
  dateTime:
    earliest: Возвращает самую раннюю дату/время
    label: Дата и время
    latest: Возвращает самую позднюю дату/время
    modTime: Возвращает изменённую строку даты/времени
    parseDuration: Возвращает разобранную длительность
    parseISOTime: Возвращает строку даты/времени в формате ISO
    strftime: Возвращает строку даты/времени по заданному формату
  general:
    description: Возвращает первое не null значение
    label: Общее
  number:
    ceil: Округляет число вверх до ближайшего целого
    floor: Округляет число вниз до ближайшего целого
    label: Число
    max: Возвращает элемент с наибольшим значением
    min: Возвращает элемент с наименьшим значением
    rounds: Округляет число с плавающей точкой до указанного количества знаков
  string:
    format: Возвращает отформатированную строку
    label: Строка
    longest: Возвращает самую длинную строку
    shortest: Возвращает самую короткую строку
    toLower: Преобразует все символы в нижний регистр
    toUpper: Преобразует все символы в верхний регистр
    trim: Удаляет пробелы в начале и конце строки
    trimLeft: Удаляет символы в начале строки
    trimRight: Удаляет символы в конце строки
example-description: Ниже приведены примеры различных сценариев использования выражений полей.
examples: Примеры
field: Поля-выражения
formatCategories:
  dateTime:
    A: Возвращает полное национальное название дня недели
    B: Возвращает полное национальное название месяца
    C: Возвращает год / 100 как десятичное число; однозначные числа с ведущим нулём
    D: Эквивалент %m/%d/%y
    F: Эквивалент %Y-%m-%d
    H: Возвращает час (24-часовой формат) как десятичное число (00-23)
    I: Возвращает час (12-часовой формат) как десятичное число (01-12)
    M: Возвращает минуту как десятичное число (00-59)
    R: Эквивалент %H:%M
    S-middle: Возвращает миллисекунду как десятичное число (000-999)
    S-second: Возвращает секунду как десятичное число (00-60)
    T: Эквивалент %H:%M:%S
    U: Возвращает номер недели года (воскресенье как первый день недели) как десятичное число (00-53)
    V: Возвращает номер недели года (понедельник как первый день недели) как десятичное число (01-53)
    W: Возвращает номер недели года (понедельник как первый день недели) как десятичное число (00-53)
    X: Возвращает национальное представление времени
    "Y": Возвращает год с веком как десятичное число
    Z: Возвращает название часового пояса
    a: Возвращает сокращенное национальное название дня недели
    b: Возвращает сокращенное национальное название месяца
    c: Возвращает национальное представление времени и даты
    d: Возвращает день месяца как десятичное число (01-31)
    e: Возвращает день месяца как десятичное число (1-31)
    j: Возвращает день года как десятичное число (001-366)
    k: Возвращает час (24-часовой формат) как десятичное число (0-23)
    l: Возвращает час (12-часовой формат) как десятичное число (1-12)
    label: Форматирование даты и времени
    m: Возвращает месяц как десятичное число (01-12)
    "n": |-
      Возвращает перевод строки (
      )
    p: Возвращает национальное представление либо "ante meridiem" (a.m.) либо "post meridiem" (p.m.)
    percent: Возвращает %
    r: Эквивалент %I:%M:%S %p
    t: Возвращает табуляцию
    u: Возвращает день недели (понедельник как первый день недели) как десятичное число (1-7)
    v: Эквивалент %e-%b-%Y
    w: Возвращает день недели (воскресенье как первый день недели) как десятичное число (0-6)
    x: Возвращает национальное представление даты
    "y": Возвращает год без века как десятичное число (00-99)
    z: Возвращает смещение часового пояса от UTC
  string:
    E: Возвращает число с плавающей точкой в научной записи; верхний регистр E
    O: Возвращает число в базе 8 с префиксом 0o
    X: Возвращает число в базе 16; верхний регистр A-F
    b: Возвращает число в базе 2 (в двоичном формате)
    binary: Возвращает число с плавающей точкой в научной записи с двоичным показателем
    d: Возвращает число в базе 10
    e: Возвращает число с плавающей точкой в научной записи; нижний регистр e
    f: Возвращает число с плавающей точкой с десятичной точкой
    label: Форматирование строки
    o: Возвращает число в базе 8
    t: Возвращает логическое значение как true/false
    v: Возвращает исходное значение
    x: Возвращает число в базе 16; нижний регистр a-f
