title: Консоль управления данными
connection-location: Местоположение подключения
description: 
  first: Консоль управления данными позволяет просматривать ваши персональные данные, запрашивать удаление или экспорт данных.
  second: Эти действия требуют подтверждения со стороны DC (Контролёра данных) вашей организации
user-options:
  data-overview:
    title: Обзор данных
    description: Просмотрите информацию профиля и ваши персональные данные, хранящиеся в приложениях Corteza
    button-label: Просмотреть ваши данные
  privacy-requests:
    title: Запросы на конфиденциальность
    description: Получите доступ, управляйте или экспортируйте список всех ваших запросов, связанных с конфиденциальностью (удаление, экспорт, корректировка)
    button-label: Ваши запросы на конфиденциальность
  export:
    title: Экспорт данных
    description: Откройте новый запрос на экспорт данных, выбрав тип данных, диапазон дат и формат итогового файла
    button-label: Запросить экспорт данных
  delete:
    title: Удаление данных
    description: Запросите удаление выбранных персональных данных из системы
    button-label: Запросить удаление данных
dc-options:
  privacy-requests:
    title: Запросы на конфиденциальность
    description: Получите доступ, управляйте или экспортируйте список всех запросов, связанных с конфиденциальностью (удаление, экспорт, корректировка)
    button-label: Входящие запросы на конфиденциальность
  sensitive-data:
    title: Чувствительные данные
    description: Обзор всех модулей с полями чувствительных данных
    button-label: Список чувствительных данных
