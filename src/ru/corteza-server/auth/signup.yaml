template:
  title: Регистрация
  form:
    email:
      label: Электронная почта
      placeholder: email@domain.tld
    password:
      label: Пароль
      placeholder: Пароль
    name:
      label: Полное имя
      placeholder: Ваше полное имя
    nickname:
      label: Краткое имя, никнейм или псевдоним
      placeholder: Краткое имя, никнейм или псевдоним
    button:
      sign-up: Зарегистрироваться
  log-in: Уже есть аккаунт? <a data-test-id="link-login" href="{{link}}">Войти</a>

alerts:
  signup-successful: Регистрация успешна
  email-confirmed-logged-in: Электронная почта подтверждена, вы вошли в систему.
  invalid-expired-token: Недействительный или истёкший токен подтверждения почты, пожалуйста, отправьте запрос повторно.
  signup-disabled: Регистрация отключена
