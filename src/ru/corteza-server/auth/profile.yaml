template:
  title: Ваш профиль
  form:
    email:
      label: Электронная почта
      placeholder: email@domain.tld
      resend-confirmation-link: Электронная почта не подтверждена, <a data-test-id="link-resend-confirmation" href="{{link}}?resend">отправить ссылку повторно.</a>
    name:
      label: Полное имя
      placeholder: Ваше полное имя
    handle:
      label: Никнейм
      placeholder: Краткое имя, никнейм или псевдоним
    avatar:
      label: Аватар
      delete: Удалить
      upload: Загрузить аватар
    avatar-initial:
      label: Инициалы для аватара
      color: Цвет текста аватара
      background-color: Цвет фона аватара
    preferred-language:
      label: Предпочтительный язык
    buttons:
      submit: Обновить профиль
alerts:
  profile-updated: Профиль успешно обновлён
  profile-update-fail: Не удалось обновить профиль из-за ошибок ввода
  profile-avatar-uploaded: Аватар профиля успешно загружен
  profile-avatar-deleted: Аватар профиля успешно удалён
