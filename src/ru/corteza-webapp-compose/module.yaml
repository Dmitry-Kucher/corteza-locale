        placeholder: Выберите соединение с базой данных
        description: Изменение соединения сбросит конфигурацию уровня чувствительности на модуле и полях, если уровень чувствительности не совместим с новым соединением
      ident:
        label: Имя коллекции или таблицы базы данных
        placeholder: compose_record
        description: "Имя таблицы базы данных или коллекции, где записи можно получить и сохранить. Поддерживает плейсхолдеры для разделения: {{module}} для имени модуля и {{namespace}} для имени пространства имен"

      connections:
        fetch-failed: Не удалось получить доступные соединения


      module-fields:
        label: Сопоставление полей модуля и кодировка
        description: |
          Настройте, как поля записей хранятся и считываются из базы данных.
          По умолчанию значения кодируются в JSON и хранятся в одном поле.
          Альтернативно можно использовать столбцы с тем же именем, что и имя поля (Столбец),
          или использовать псевдоним и хранить значение непосредственно в столбце.

      system-fields:
        label: Сопоставление системных полей и кодировка
        description: |
          Системные поля используются для хранения метаданных о записи.
          Настройте, чтобы пропустить или сохранить их в столбце с тем же именем (Столбец),
          в другом столбце (Псевдоним) или закодировать их в JSON.
        grouptypes:
          all: Все
          partition: Раздел
          userReference: Ссылка на пользователя
          timestamps: Метки времени
          extras: Дополнительно


      encoding-strategy:
        unavailable: недоступно
        ident:
          placeholder: Имя поля или столбца базы данных

        strategies:
          plain:
            label: Столбец
          alias:
            label: Псевдоним
          json:
            label: JSON


    privacy:
      title: Конфиденциальность
      sensitivity-level:
        label: Наивысший разрешенный уровень чувствительности
        placeholder: Выберите уровень чувствительности
        description: Наивысший разрешенный уровень чувствительности для полей в этом модуле, изменение этого значения сбросит уровень чувствительности полей, если они не совместимы.
      usage-disclosure:
        label: Раскрытие использования конфиденциальных данных (видно в консоли конфиденциальности данных)

      sensitivity-levels:
        fetch-failed: Не удалось получить уровни чувствительности

    record-revisions:
      title: Версии записей
      enabled: Включить версии записей
      ident:
        label: Идентификатор
        placeholder: compose_record_revisions
        description: 'Имя таблицы базы данных или коллекции, где версии записей можно получить и сохранить. Поддерживает плейсхолдеры для разделения: {{module}} для имени модуля и {{namespace}} для имени пространства имен'

    validation:
      title: Валидация

      record-duplication:
        title: Обнаружение дублирования записей
        strict-fields:
          label: Строгая валидация дублирования значений
          description: Запись не будет сохранена, когда обнаружено дублирование значения в выбранных полях в любой существующей записи этого модуля
        non-strict-fields:
          label: Нестрогая валидация дублирования значений
          description: Запись будет сохранена, и пользователь будет предупрежден, когда обнаружено дублирование значения в выбранных полях в любой существующей записи этого модуля

    uniqueValues:
      title: Уникальные значения
      duplicationDetection: Обнаружение дублирования
      preventRecordsSave: Предотвратить сохранение записей, если обнаружены дублирующиеся значения
      warningLabel: Предупреждение или сообщение об ошибке при совпадении ограничения
